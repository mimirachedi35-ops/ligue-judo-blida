<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Ligue de Judo Blida</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ligue Judo Blida">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="icon" href="logo.jpg">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== ECRAN DE CONNEXION ===================== -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <img src="logo.jpg" alt="Ligue de Judo Blida" class="league-logo-img">
    <div class="league-title">Ligue de Judo — Wilaya de Blida</div>
    <div class="league-sub">Saison sportive <span id="loginSeason">2026/2027</span></div>
    <input type="password" id="passwordInput" class="access-input" placeholder="Code d'accès" autocomplete="off">
    <button id="loginBtn" class="btn-enter">ENTRER</button>
    <div id="loginError" class="login-error"></div>
    <div class="hidden-signature">Ραχεντι Χαντιλ</div>
  </div>
</div>

<!-- ===================== APPLICATION ===================== -->
<div id="appScreen" class="app-screen" style="display:none;">

  <header class="topbar">
    <img src="logo.jpg" alt="logo" class="mini-logo">
    <div class="topbar-info">
      <div class="topbar-title">Ligue de Judo — Wilaya de Blida</div>
      <div class="topbar-sub">Saison sportive <span id="currentSeasonLabel">2026/2027</span></div>
    </div>
  </header>
  <div class="topbar-actions">
    <span class="role-badge">Administrateur</span>
    <button id="logoutBtn" class="btn-quit">QUITTER</button>
  </div>
  <div class="red-divider"></div>

  <nav class="tabs-grid" id="tabsNav">
    <button class="tab-box active" data-tab="dashboard">Tableau de bord</button>
    <button class="tab-box" data-tab="clubs">Clubs</button>
    <button class="tab-box" data-tab="journal">Journal</button>
    <button class="tab-box" data-tab="caisse">Caisse de la Ligue</button>
    <button class="tab-box" data-tab="stats">Statistiques</button>
    <button class="tab-box" data-tab="archives">Archives</button>
    <button class="tab-box tab-box-full" data-tab="settings">Réglages</button>
  </nav>

  <main id="mainContent" class="main-content"></main>
</div>

<!-- ===================== MODALES (conteneur générique) ===================== -->
<div id="modalOverlay" class="modal-overlay" style="display:none;">
  <div id="modalBox" class="modal-box"></div>
</div>

<script src="app.js"></script>
</body>
</html>
